name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Run linter
        run: npm run lint

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REQUIRE_PRODUCTION_SITE_URL: '1'
        run: npm run build

      - name: Verify build outputs and launchers
        env:
          EXPECTED_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          echo "Verifying required production artifacts..."
          test -f dist/index.html
          test -f dist/lessons/8E/index.html
          test -f dist/lessons/8F/index.html
          test -f dist/downloads/8E-stem-and-leaf-plots.html
          test -f dist/downloads/8F-sector-graphs-and-divided-bar-graphs.html

          echo "Verifying launcher destinations do not contain localhost or loopback..."
          if grep -E -i "localhost|127\.0\.0\.1|::1" dist/downloads/*.html; then
            echo "Error: Localhost or loopback address found in generated launchers!"
            exit 1
          fi

          echo "Verifying launchers target configured production site URL..."
          grep -F "${EXPECTED_BASE_URL}/lessons/8E/" dist/downloads/8E-stem-and-leaf-plots.html
          grep -F "${EXPECTED_BASE_URL}/lessons/8F/" dist/downloads/8F-sector-graphs-and-divided-bar-graphs.html
          echo "Build output verification succeeded!"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
